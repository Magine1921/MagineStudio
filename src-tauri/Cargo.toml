[package]
name = "magine-studio"
version = "1.0.0"
description = "MiniMax H3 local video generation desktop client"
authors = ["Magine"]
license = "Apache-2.0"
homepage = "https://github.com/Magine1921/MagineStudio"
repository = "https://github.com/Magine1921/MagineStudio"
edition = "2024"

[lib]
name = "magine_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39.6"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "multipart", "stream", "system-proxy"] }
futures-util = "0.3"
sha2 = "0.11.0"
hex = "0.4"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
