name: Bug report
description: Report a reproducible MagineStudio problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove usernames, tokens, prompts, and private local paths from screenshots and logs.

  - type: input
    id: version
    attributes:
      label: MagineStudio version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Hardware or environment detection
        - Installation or model paths
        - ComfyUI runtime
        - Video generation
        - Preview or task state
        - User interface
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, GPU, VRAM, driver, ComfyUI version, and model type. Do not include private paths.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and private information.
          required: true
